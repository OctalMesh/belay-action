# ============================================================================ #
#                           End-to-End Test Workflow                           #
# ============================================================================ #
# Runs end-to-end tests by executing the built action in a test workflow on    #
# every push to dev and on every pull request targeting dev that includes      #
# changes to the built action files.                                           #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip]   - skips all workflows                                          #
#   [test-skip] - skips all test workflows                                     #
#   [e2e-skip]  - skips this workflow only                                     #
#                                                                              #
# Note: skip tags are ignored for scheduled runs.                              #
# ============================================================================ #

name: "Test: End-to-End"

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "dist/**"
      - "action.yaml"
  pull_request:
    branches: [ "dev" ]
    paths:
      - "dist/**"
      - "action.yaml"

permissions:
  contents: read
  actions: write

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.belay.outputs.issued }}

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Check skip tags"
        id: belay
        uses: OctalMesh/belay-action@release
        with:
          signal_tags: "[ci-skip],[test-skip],[e2e-skip]"

  # Run end-to-end tests
  e2e:
    name: "End-to-End Test"
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Run: Test built action in a workflow"
        uses: ./
