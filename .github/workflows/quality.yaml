# ============================================================================ #
#                               Quality Workflow                               #
# ============================================================================ #
# Runs Prettier formatting check and ESLint static analysis on every push to   #
# dev and on every pull request targeting dev.                                 #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip]      - skips all workflows                                       #
#   [quality-skip] - skips this workflow only                                  #
#                                                                              #
# Note: skip tags are ignored for scheduled runs.                              #
# ============================================================================ #

name: "Quality"

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "*.config.*"
      - ".prettierrc"
      - ".prettierignore"
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Check skip tags"
        id: skip_check
        env:
          SKIP_TAGS: "[ci-skip] [quality-skip]"
          PR_TITLE: ${{ github.event.pull_request.title }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        # For pull_request events: use PR title + latest commit message
        # For push events: use the latest commit message from git log
        # Scheduled runs: always execute regardless of skip tags
        run: |
          if [[ "$IS_SCHEDULED" == "true" ]]; then
            echo "should_skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --format="%s %b")
          COMBINED="${PR_TITLE} ${COMMIT_MSG}"

          for tag in $SKIP_TAGS; do
            if [[ "$COMBINED" == *"$tag"* ]]; then
              echo "should_skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "should_skip=false" >> $GITHUB_OUTPUT

  # Perform quality analysis
  quality:
    name: "Analyze"
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup: pnpm"
        uses: pnpm/action-setup@v6

      - name: "Setup: Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: "Setup: Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Run: Prettier check"
        run: pnpm format:check

      - name: "Run: ESLint check"
        run: pnpm lint
