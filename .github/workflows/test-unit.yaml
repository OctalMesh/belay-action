# ============================================================================ #
#                              Unit Test Workflow                              #
# ============================================================================ #
# Runs Vitest unit and integration tests on every push to dev and on every     #
# pull request targeting dev.                                                  #
#                                                                              #
# Skip tags (anywhere in commit message or PR title):                          #
#   [ci-skip]   - skips all workflows                                          #
#   [test-skip] - skips all test workflows                                     #
#   [unit-skip] - skips this workflow only                                     #
#                                                                              #
# Note: skip tags are ignored for scheduled runs.                              #
#                                                                              #
# See: https://vitest.dev/guide/                                               #
# ============================================================================ #

name: "Test: Unit"

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "*.config.*"
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  # Check if the commit message contains skip tags
  check:
    name: "Skip Check"
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.belay.outputs.issued }}

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: "Run: Check skip tags"
        id: belay
        uses: OctalMesh/belay-action@release
        with:
          signal_tags: "[ci-skip],[test-skip],[unit-skip]"

  # Run Vitest test suite
  test:
    name: "Run Tests"
    needs: check
    if: needs.check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Setup: Checkout repository"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: "Setup: pnpm"
        uses: pnpm/action-setup@v6

      - name: "Setup: Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: "Setup: Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Run: Execute tests"
        run: pnpm test:run
