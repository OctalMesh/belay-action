name: "🐞 Bug Report"
description: "Create a report about something that is not working"
title: "[Bug]: "
labels: [ "Bug" ]
type: "Bug"

body:
  - type: markdown
    attributes:
      value: "Your issue may have already been reported before, so please check for existing issues before reporting any bugs."

  - type: textarea
    attributes:
      label: "Environment & Context"
      description: |
        Please provide details about the CI environment where the issue occurred:
        - Action version (e.g., v1.0.0, latest dev commit SHA)
        - GitHub Runner OS (e.g., `ubuntu-latest`, `windows-latest`)
        - Node.js & pnpm versions (if applicable)
        - Action execution mode (e.g., triggered on `pull_request`, `push`, `schedule`)
      placeholder: |
        - Action version: v1.0.0
        - Runner: ubuntu-latest
        - Node.js: v22.x / pnpm: v11.x
        - Event: pull_request
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Bug description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true

  - type: textarea
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: false

  - type: textarea
    attributes:
      label: "Steps To Reproduce"
      description: "Specify clear and concise step-by-step actions to reproduce the problem."
    validations:
      required: false

  - type: textarea
    attributes:
      label: "Additional context"
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: "Acknowledgements"
      description: "Your issue will be closed if you haven't done these steps."
      options:
        - label: "I have searched the existing issues and this is a new issue and not a duplicate of any another open issue."
          required: true
        - label: "I have written a short but informative title."
          required: true
        - label: "I have filled out all of the requested information in this issue properly."
          required: true
