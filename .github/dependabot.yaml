# ============================================================================ #
#                        Dependabot Configuration File                         #
# ============================================================================ #
# This file defines the Dependabot configuration for this project. It keeps    #
# both npm dependencies and GitHub Actions up to date by opening pull requests #
# on a weekly schedule, grouped by ecosystem.                                  #
#                                                                              #
# See: https://dependabot.com                                                  #
# ============================================================================ #

version: 2

updates:
  # Keep pnpm dependencies up to date
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    open-pull-requests-limit: 5

    # Runs every Monday at 6:00 AM UTC
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"

    # Reviewers for the pull requests
    reviewers:
      - "OctalMesh/development"

    # Labels for the pull requests
    labels:
      - "Dependencies"

    groups:
      # TypeScript ecosystem packages
      typescript:
        patterns:
          - "typescript"
          - "typescript-*"

      # ESLint ecosystem packages
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"

      # Prettier ecosystem packages
      prettier:
        patterns:
          - "prettier"
          - "prettier-*"
          - "@trivago/prettier-*"

      # Testing-related packages
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "vite-*"
          - "@vitejs/*"

      # Build and CLI tools
      dev-tools:
        patterns:
          - "tsup"
          - "npm-check-updates"

      # TypeScript types packages
      types:
        patterns:
          - "@types/node"

    # Ignore major version updates for critical dependencies to prevent breaking
    # changes without manual review
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "typescript-eslint"
        update-types: [ "version-update:semver-major" ]

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    open-pull-requests-limit: 5

    # Runs every Monday at 6:00 AM UTC
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"

    # Reviewers for the pull requests
    reviewers:
      - "OctalMesh/development"

    # Labels for the pull requests
    labels:
      - "Dependencies"

    groups:
      # GitHub Actions ecosystem packages
      github-actions:
        patterns:
          - "*"
