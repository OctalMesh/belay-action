# ============================================================================ #
#               CodeQL Configuration for JavaScript/TypeScript                 #
# ============================================================================ #
# This file defines the CodeQL analysis configuration for this project. It     #
# specifies which paths to exclude from analysis, which query suites to run,   #
# and which rules to suppress to reduce noise.                                 #
# ============================================================================ #

name: "CodeQL Configuration"

paths-ignore:
  # Dependencies & build output

  - "node_modules/**"
  - "dist/**"
  - "coverage/**"
  - "out/**"

  # Config & tooling

  - "*.config.{ts,js,mts,mjs,cts,cjs}"
  - "*.setup.{ts,js,mts,mjs,cts,cjs}"

  # Test files

  - "**/testdata/**"
  - "**/__tests__/**"
  - "**/__mocks__/**"
  - "**/*.test.{ts,js}"
  - "**/*.spec.{ts,js}"
  - "**/vitest.setup.*"
  - "**/vitest.config.*"

  # Type declarations

  - "**/*.d.ts"

queries:
  - uses: "security-and-quality"

query-filters:
  - exclude:
      tags contain: "correctness/unused-variable"
