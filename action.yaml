# ============================================================================ #
#                           Belay Configuration File                           #
# ============================================================================ #
# This file defines the configuration for Belay, a custom GitHub Action        #
# designed for signal-based workflow control. It evaluates commit messages,    #
# pull request titles, and labels against configured signals and executes      #
# a specified order in response.                                               #
# ============================================================================ #

# Metadata configuration
name: "Belay"
description: "A lightweight TypeScript action for signal-based CI/CD workflow control"
author: "OctalMesh"

# GitHub Marketplace Branding
branding:
  icon: "anchor"
  color: "blue"

# Input parameters configuration
inputs:
  signal_tags:
    description: >
      Comma-separated list of substrings to match against the commit message
      and pull request title. If any substring is found, a belay order is issued.
    required: false
    default: "[ci-skip],[skip-ci]"

  signal_patterns:
    description: >
      Comma-separated list of regex patterns to match against the commit message
      and pull request title. If any pattern matches, a belay order is issued.
    required: false

  signal_labels:
    description: >
      Comma-separated list of pull request label names. If any label is applied
      to the pull request, a belay order is issued.
    required: false
    default: "ci-skip,skip-ci"

  on_match:
    description: >
      Action to execute when a belay order is issued.
      Accepted values: report, cancel.
    required: false
    default: "report"

  github_token:
    description: "GitHub token used to interact with the GitHub API."
    required: false
    default: ${{ github.token }}

# Output parameters configuration
outputs:
  issued:
    description: "Returns 'true' if a belay order was issued, 'false' otherwise."

# Execution runtime environment
runs:
  using: "node24"
  main: "dist/index.js"
